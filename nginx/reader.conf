# victoria-tech.com 의 nginx `default` server 블록 안에 include 한다.
#   /etc/nginx/snippets/reader.conf
#
# /reader 요청을 독서대 컨테이너(127.0.0.1:3100)로 넘긴다. 앱이 basePath=/reader 로
# 빌드되어 있으므로 경로를 벗기지 않고 그대로 넘긴다(proxy_pass 뒤에 URI 없음).
# TLS 는 CloudFront 가 맡는다. 여기서는 80 만 듣는다.

location /reader {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Host 를 그대로 넘긴다. Next 의 Server Action origin 검사가 이 값을 본다.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # CloudFront 가 TLS 를 끝내고 평문으로 넘기므로 $scheme 은 항상 http 다. 80 번은
    # 보안그룹이 CloudFront 접두어 목록으로 막고 있어 실제 뷰어는 전부 https 다.
    proxy_set_header X-Forwarded-Proto https;

    proxy_cache_bypass $http_upgrade;

    # /auth/confirm 응답은 Supabase 세션 쿠키(Set-Cookie 여러 KB)를 싣는다. 기본
    # 버퍼(4k)로는 "upstream sent too big header" 로 502 가 난다.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # 백업 JSON 복원 업로드
    client_max_body_size 20M;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# 안드로이드 앱(TWA, android/) 의 Digital Asset Links.
# 도메인 루트에 있어야 하므로 /reader 밖이다. 이 파일이 있어야 앱이 주소창 없이
# 전체 화면으로 뜬다(없으면 Custom Tab 처럼 주소창이 보인다).
# 지문은 android/android.keystore 의 SHA-256. 키를 바꾸면 android/assetlinks.json 과 함께 고친다.
location = /.well-known/assetlinks.json {
    default_type application/json;
    return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.victoriatech.reader","sha256_cert_fingerprints":["9A:6F:76:08:D8:9E:E0:AF:A1:5D:81:73:1C:5B:07:A4:50:C4:38:77:6C:81:E2:91:A2:F4:69:00:ED:77:49:C0"]}}]';
}
