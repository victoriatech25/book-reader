# victoria-tech.com 의 nginx `default` server 블록 안에 include 한다.
#   /etc/nginx/snippets/reader.conf
#
# /reader 요청을 독서대 컨테이너(127.0.0.1:3100)로 넘긴다. 앱이 basePath=/reader 로
# 빌드되어 있으므로 경로를 벗기지 않고 그대로 넘긴다(proxy_pass 뒤에 URI 없음).
# TLS 는 CloudFront 가 맡는다. 여기서는 80 만 듣는다.

location /reader {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Host 를 그대로 넘긴다. Next 의 Server Action origin 검사가 이 값을 본다.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_bypass $http_upgrade;

    # /auth/confirm 응답은 Supabase 세션 쿠키(Set-Cookie 여러 KB)를 싣는다. 기본
    # 버퍼(4k)로는 "upstream sent too big header" 로 502 가 난다.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # 백업 JSON 복원 업로드
    client_max_body_size 20M;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
